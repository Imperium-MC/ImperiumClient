<!doctype html>
<html><head><meta charset="utf-8"><title>HUD editor</title><link rel="stylesheet" href="imperium.css">
<style>
  body { background: linear-gradient(180deg, #7fa7cf 0%, #a9c6e0 43%, #6d8a5c 44%, #57713f 70%, #3e4c33 100%); }
  body::before { content: ''; position: absolute; inset: 0; background: rgba(8,7,6,.22); }
  .el { position: absolute; z-index: 2; background: rgba(0,0,0,.42); padding: 4px 6px; display: flex; flex-direction: column; gap: 4px; }
  .el.ghost { outline: 2px dashed rgba(242,237,228,.4); outline-offset: 2px; }
  .el.sel { outline: 2px solid var(--bronze); outline-offset: 2px; }
  .h { position: absolute; z-index: 3; width: 10px; height: 10px; }
  .tag { position: absolute; z-index: 3; padding: 3px 8px; font-size: 13px; }
  .guide { position: absolute; z-index: 1; background: var(--bronze-hi); }
  .bar { position: absolute; left: 50%; top: 14px; transform: translateX(-50%); z-index: 4; display: flex; gap: 6px; padding: 6px; }
  .bar .btn { height: 34px; }
  .menu { position: absolute; z-index: 5; width: 210px; padding: 6px; }
  .menu .it { height: 32px; display: flex; align-items: center; gap: 10px; padding: 0 8px; font-weight: 600; font-size: 14px; color: var(--text-2); }
  .menu .it.on { background: var(--basalt-3); color: var(--marble); }
  .menu .it .sc { margin-left: auto; }
  .menu .rule { height: 2px; background: var(--seam); margin: 4px 0; }
  .anchor { display: grid; grid-template-columns: repeat(3, 10px); gap: 2px; margin-left: auto; }
  .anchor i { width: 10px; height: 10px; background: #0a0908; box-shadow: inset 0 0 0 2px var(--seam-hi); }
  .anchor i.on { background: var(--bronze); box-shadow: none; }
  .hotbar { position: absolute; left: 50%; bottom: 8px; transform: translateX(-50%); width: 364px; height: 44px; z-index: 1; background: rgba(0,0,0,.4); box-shadow: 0 0 0 2px rgba(0,0,0,.6); }
</style></head>
<body>
<div class="bar stone frame">
  <span class="btn plate"><span data-g="check"></span>Snapping</span>
  <span class="btn stone">Grid</span>
  <span class="btn stone">Undo <span data-mc="Ctrl+Z" data-color="#a3937a" data-scale="2"></span></span>
  <span class="btn stone">Reset all</span>
  <span class="btn stone">Modules</span>
  <span class="btn plate">Done</span>
</div>

<div class="el" style="left:14px;top:14px"><span data-mc="78 FPS" data-color="#ffffff" data-scale="2" data-shadow></span></div>
<div class="el ghost" style="left:14px;top:50px"><span data-mc="12 | 4 CPS" data-color="#ffffff" data-scale="2" data-shadow></span></div>
<div class="el" style="left:14px;top:86px">
  <span data-mc="X 1244  Y 64  Z -322" data-color="#ffffff" data-scale="2" data-shadow></span>
  <span data-mc="North-East  Plains" data-color="#c8c8c8" data-scale="2" data-shadow></span>
</div>

<div class="guide" style="left:536px;top:0;bottom:0;width:2px"></div>
<div class="guide" style="left:0;right:0;top:214px;height:2px"></div>
<div class="tag plate" style="left:536px;top:182px">Potion Status · hold Alt to stop snapping</div>
<div class="el sel" style="left:536px;top:214px">
  <span><span data-mc="Speed II        1:23" data-color="#7cfc7c" data-scale="2" data-shadow></span></span>
  <span><span data-mc="Fire Resistance 6:40" data-color="#ffb55a" data-scale="2" data-shadow></span></span>
  <span><span data-mc="Night Vision     --:--" data-color="#b9a8ff" data-scale="2" data-shadow></span></span>
</div>
<span class="h plate" style="left:528px;top:206px"></span><span class="h plate" style="left:754px;top:206px"></span>
<span class="h plate" style="left:528px;top:290px"></span><span class="h plate" style="left:754px;top:290px"></span>

<div class="menu stone frame" style="left:780px;top:224px">
  <div class="it on"><span data-g="gear"></span>Settings<span class="sc"><span data-mc="RMB" data-color="#a3937a" data-scale="2"></span></span></div>
  <div class="it"><span data-g="reset"></span>Reset position</div>
  <div class="it"><span data-g="close"></span>Hide<span class="sc"><span data-mc="Del" data-color="#a3937a" data-scale="2"></span></span></div>
  <div class="rule"></div>
  <div class="it">Anchor<span class="anchor"><i></i><i class="on"></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span></div>
</div>

<div class="el" style="right:14px;top:14px;flex-direction:row;align-items:center;gap:8px">
  <img src="mc/ender_pearl.png" style="width:32px;height:32px;image-rendering:pixelated"><span data-mc="4.2s" data-color="#ffffff" data-scale="2" data-shadow></span>
</div>
<div class="hotbar"></div>
<div class="caption" style="color:rgba(242,237,228,.85)">HUD editor over the game · arrows move 1 px, Shift 10 px · right-click for options</div>
<script src="glyphs.js"></script><script src="mcfont.js"></script>
</body></html>
