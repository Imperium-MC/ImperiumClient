pluginManagement {
	repositories {
		maven {
			name = 'Fabric'
			url = 'https://maven.fabricmc.net/'
		}
		maven {
			name = 'Ornithe'
			url = 'https://maven.ornithemc.net/releases'
		}
		maven {
			name = 'Ornithe Snapshots'
			url = 'https://maven.ornithemc.net/snapshots'
		}
		gradlePluginPortal()
	}
}

boolean checkProp(String property) {

	String value = getProperties().get("axolotlclient.modules." + property)
	return !(value == null || value.isEmpty() || value == "false" || value == "f")
}

void optional(String name) {
	if (checkProp(name) || checkProp("all")) {
		System.out.println("Adding " + name)
		include name
		project(":$name").projectDir = file("versions/$name")
	}
}

rootProject.name = "AxolotlClient-mod"

// The common module compiles Kotlin, but its shadow artifact is consumed by the version
// modules where the Kotlin runtime is provided by fabric-language-kotlin. Stop the Kotlin
// Gradle plugin from auto-adding kotlin-stdlib to common's api configuration: it would leak
// onto every consumer's compile classpath (dragging a transitive org.jetbrains:annotations
// conflict with it). common declares the stdlib compileOnly itself instead.
gradle.beforeProject { project ->
	if (project.name == 'common') {
		project.extensions.extraProperties.set('kotlin.stdlib.default.dependency', 'false')
	}
}

include 'common'

System.out.println("Adding submodules..")

optional 'latest'

