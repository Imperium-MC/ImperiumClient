name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew :latest:build

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: ImperiumClient-jar
          path: versions/latest/build/libs/*.jar

  # The client gametest spins a real Minecraft client. GitHub's ubuntu runners
  # have no GPU, so this runs under xvfb with mesa's software GL (llvmpipe),
  # which renders roughly 20x slower than a real GPU: the full suite needs
  # over an hour here and cannot finish. CI therefore runs the headless "ci"
  # subset instead (-Pimperium.fastGametests): the logic/protocol tests that
  # need no world rendering (ImperiumGametestSubsets in the test source set
  # picks the subset; the framework itself can only filter whole mods). The
  # subset boots the client once, runs no worlds, and completes in minutes —
  # no continue-on-error needed. The full suite (all tests, screenshots) stays
  # the default locally on a real GPU and runs before every release.
  gametest:
    name: Gametest (headless subset)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install display and GL dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb libgl1 libglx-mesa0 libgl1-mesa-dri

      - name: Client gametests (headless ci subset)
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: xvfb-run -a -s "-screen 0 1280x1024x24" ./gradlew :latest:runClientGameTest -Pimperium.fastGametests

      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gametest-run
          path: |
            versions/latest/build/run/clientGameTest/screenshots/
            versions/latest/build/run/clientGameTest/logs/
          if-no-files-found: ignore
