name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build and gametest
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # The client gametest spins a real Minecraft client: it needs a display and a GL
      # implementation. xvfb provides the display, the mesa packages provide software GL
      # (llvmpipe) for LWJGL.
      - name: Install display and GL dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb libgl1 libglx-mesa0 libgl1-mesa-dri

      - name: Build
        run: ./gradlew :latest:build

      - name: Client gametests
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: xvfb-run -a -s "-screen 0 1280x1024x24" ./gradlew :latest:runClientGameTest

      - name: Upload screenshots and logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gametest-failure
          path: |
            versions/latest/build/run/clientGameTest/screenshots/
            versions/latest/build/run/clientGameTest/logs/
          if-no-files-found: ignore

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: ImperiumClient-jar
          path: versions/latest/build/libs/*.jar
          if-no-files-found: error
